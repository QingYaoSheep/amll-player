name: NetEase playback callback reproduction
on:
  push:
    branches: [codex/netease-playback-crash-repro]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: bash Scripts/generate-project.sh
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
      - name: Prepare simulator
        run: node Scripts/prepare-ci-simulators.cjs
      - name: Reproduce off-main Now Playing artwork callback
        run: >-
          xcodebuild test -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerTests/NetEasePlaybackCallbackTests
          -resultBundlePath build/NetEase-callback.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export reproduction evidence
        if: always()
        run: |
          mkdir -p build/CrashReports
          cp ~/Library/Logs/DiagnosticReports/*AMLL* build/CrashReports/ 2>/dev/null || true
          if [[ -d build/NetEase-callback.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/NetEase-callback.xcresult > build/summary.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NetEase-playback-crash-reproduction
          path: |
            build/NetEase-callback.xcresult
            build/CrashReports
            build/summary.json
      - name: Remove simulator
        if: always()
        run: |
          xcrun simctl shutdown "$CI_IPHONE_UDID" || true
          xcrun simctl delete "$CI_IPHONE_UDID" || true
