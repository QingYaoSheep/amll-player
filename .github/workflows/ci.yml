name: SwiftUI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-26:
    name: Xcode 26 / iOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"

      - name: Generate project
        run: bash Scripts/generate-project.sh

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer

      - name: Lint Swift
        run: >-
          xcrun swift-format lint --recursive
          AMLLPlayer AMLLPlayerTests AMLLPlayerUITests

      - name: Test on iPhone
        run: >-
          xcodebuild test
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO

      - name: Build for iPad
        run: >-
          xcodebuild build
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=latest'
          CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned archive
        run: >-
          xcodebuild archive
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/AMLLPlayer.xcarchive"
          CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: AMLLPlayer-unsigned-xcarchive
          path: ${{ runner.temp }}/AMLLPlayer.xcarchive
          if-no-files-found: error

  xcode-27:
    name: Xcode 27 / iOS 27 SDK
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          [[ "$SDK_VERSION" == 27.* ]]

      - name: Generate project
        run: bash Scripts/generate-project.sh

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer

      - name: Build with iOS 27 SDK
        run: |
          xcodebuild build \
            -project AMLLPlayer.xcodeproj \
            -scheme AMLLPlayer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Xcode27DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Create unsigned device archive and IPA
        run: |
          xcodebuild archive \
            -project AMLLPlayer.xcodeproj \
            -scheme AMLLPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AMLLPlayer-Xcode27.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          PACKAGE_ROOT="$RUNNER_TEMP/amll-unsigned-ipa"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R \
            build/AMLLPlayer-Xcode27.xcarchive/Products/Applications/AMLLPlayer.app \
            "$PACKAGE_ROOT/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$PACKAGE_ROOT/Payload" \
            build/AMLLPlayer-Xcode27-unsigned.ipa

      - name: Upload Xcode 27 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AMLLPlayer-Xcode27-unsigned-ipa
          path: build/AMLLPlayer-Xcode27-unsigned.ipa
          if-no-files-found: error
