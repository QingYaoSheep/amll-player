name: Product before screenshots
on:
  push:
    branches: [codex/product-before-captures]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: bash Scripts/generate-project.sh
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
      - name: Prepare simulator
        run: |
          if ! xcrun simctl list runtimes --json | node -e 'const fs = require("node:fs"); const { selectRuntime } = require("./Scripts/prepare-ci-simulators.cjs"); selectRuntime(JSON.parse(fs.readFileSync(0, "utf8")).runtimes)'; then
            xcodebuild -downloadPlatform iOS
          fi
          node Scripts/prepare-ci-simulators.cjs
      - name: Capture unchanged pre-product pages
        run: >-
          xcodebuild test
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testBeforeProductScreenshots
          -resultBundlePath build/Before-product.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export captures
        if: always()
        run: |
          if [[ -d build/Before-product.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/Before-product.xcresult --output-path build/Before-product-images
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AMLL-product-before-screenshots
          path: build/Before-product-images
          if-no-files-found: ignore
      - name: Remove simulators
        if: always()
        run: |
          for DEVICE_ID in "${CI_IPHONE_UDID:-}" "${CI_IPAD_UDID:-}"; do
            if [[ -n "$DEVICE_ID" ]]; then
              xcrun simctl shutdown "$DEVICE_ID" || true
              xcrun simctl delete "$DEVICE_ID"
            fi
          done
