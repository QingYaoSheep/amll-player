name: SwiftUI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-27:
    name: Xcode 27 / direct IPA archive
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode and SDK
        run: |
          XCODE_VERSION="$(xcodebuild -version)"
          echo "$XCODE_VERSION"
          [[ "$XCODE_VERSION" == Xcode\ 27.* ]]
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          [[ "$SDK_VERSION" == 27.* ]]

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate project
        run: bash Scripts/generate-project.sh

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer

      - name: Lint Swift
        run: >-
          xcrun swift-format lint --recursive
          AMLLPlayer AMLLPlayerTests AMLLPlayerUITests

      - name: Create unsigned device archive and IPA
        run: |
          xcodebuild archive \
            -project AMLLPlayer.xcodeproj \
            -scheme AMLLPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AMLLPlayer-Xcode27.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          PACKAGE_ROOT="$RUNNER_TEMP/amll-unsigned-ipa"
          mkdir -p "$PACKAGE_ROOT/Payload"
          cp -R \
            build/AMLLPlayer-Xcode27.xcarchive/Products/Applications/AMLLPlayer.app \
            "$PACKAGE_ROOT/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$PACKAGE_ROOT/Payload" \
            build/AMLLPlayer-Xcode27-unsigned.ipa

      - name: Verify Xcode 27 application bundle
        run: >-
          bash Scripts/verify-ios-app-bundle.sh
          build/AMLLPlayer-Xcode27.xcarchive/Products/Applications/AMLLPlayer.app

      - name: Upload Xcode 27 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AMLLPlayer-Xcode27-unsigned-ipa
          path: build/AMLLPlayer-Xcode27-unsigned.ipa
          if-no-files-found: error
