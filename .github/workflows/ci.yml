name: Catalog design verification
on:
  push:
    branches: [codex/lyrics-blend-probe]
permissions:
  contents: read
jobs:
  probe:
    name: Xcode 27 / Catalog experience
    runs-on: xcode-27
    timeout-minutes: 40
    concurrency:
      group: catalog-design-probe
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode
        run: |
          xcodebuild -version
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 27.* ]]
      - name: Install Metal toolchain
        run: |
          if xcrun --sdk iphoneos metal --version; then exit 0; fi
          xcodebuild -downloadComponent MetalToolchain
      - name: Generate project and simulators
        run: |
          bash Scripts/generate-project.sh
          node Scripts/prepare-ci-simulators.cjs
      - name: Test actual catalog pages on iPhone
        run: >-
          xcodebuild test -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerTests/MusicExperienceTests
          -only-testing:AMLLPlayerTests/NetEaseIntegrationTests
          -only-testing:AMLLPlayerTests/CatalogArtworkTests
          -only-testing:AMLLPlayerTests/SpotifyCatalogStoreTests
          -only-testing:AMLLPlayerTests/SpotifyCatalogDecoderTests
          -only-testing:AMLLPlayerUITests/MusicCatalogDesignUITests
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testProductPagesAndSearchHistory
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testCatalogNavigationAndMetadataOnlyPlaylist
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testSearchSurvivesDetailNavigation
          -resultBundlePath build/Catalog-iPhone.xcresult
          -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO
      - name: Test actual catalog pages on iPad
        if: always()
        run: >-
          xcodebuild test -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPAD_UDID"
          -only-testing:AMLLPlayerUITests/MusicCatalogDesignUITests/testPlaylistNavigationPlaybackAndRepeatedEntries
          -only-testing:AMLLPlayerUITests/MusicCatalogDesignUITests/testArtistHighlightsAndAlbumNavigation
          -resultBundlePath build/Catalog-iPad.xcresult
          -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO
      - name: Export actual page screenshots
        if: always()
        run: |
          for device in iPhone iPad; do
            if [[ -d "build/Catalog-$device.xcresult" ]]; then
              xcrun xcresulttool export attachments --path "build/Catalog-$device.xcresult" --output-path "build/Catalog-images/$device"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Catalog-design-visuals
          path: build/Catalog-images
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Catalog-design-results
          path: build/Catalog-*.xcresult
          if-no-files-found: ignore
