name: Seek V2 reproduction
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: bash Scripts/generate-project.sh
      - run: node Scripts/prepare-ci-simulators.cjs
      - name: Production page and real decoded audio
        run: >-
          xcodebuild test -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerTests/NetEaseDecodedSeekTests
          -only-testing:AMLLPlayerTests/LyricsSeekPageTests
          -parallel-testing-enabled NO
          -resultBundlePath build/seek-v2.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seek-v2-reproduction
          path: build/seek-v2.xcresult
