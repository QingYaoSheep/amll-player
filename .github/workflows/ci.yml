name: Lyrics blending diagnosis
on:
  push:
    branches: [codex/lyrics-blend-probe]
permissions:
  contents: read
jobs:
  probe:
    name: Xcode 27 / Actual lyric blending
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: lyrics-blend-probe
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode
        run: |
          xcodebuild -version
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 27.* ]]
      - name: Install Metal toolchain
        run: |
          if xcrun --sdk iphoneos metal --version; then exit 0; fi
          xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: bash Scripts/generate-project.sh
      - name: Prepare reference simulators
        run: node Scripts/prepare-ci-simulators.cjs
      - name: Test actual production lyrics
        run: >-
          xcodebuild test -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testActualLyricsAddLightAtRestThroughTheProductionZoomPresentation
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testActualMetalLyricsAddLightAtRestThroughTheProductionZoomPresentation
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testActualMeshBackedMetalLyricsAddLightAtRestThroughTheProductionZoomPresentation
          -only-testing:AMLLPlayerTests/LyricsHDRRendererTests
          -only-testing:AMLLPlayerTests/ImmersiveArtworkMediaTests/testPageCompositingPreservesActualVideoReflectionAndLiveBlurAtRest
          -resultBundlePath build/LyricsBlend.xcresult
          -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO
      - name: Export actual rendering evidence
        if: always()
        run: |
          if [[ -d build/LyricsBlend.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/LyricsBlend.xcresult --output-path build/Blend-images
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lyrics-blend-probe-visuals
          path: build/Blend-images
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lyrics-blend-probe-results
          path: build/LyricsBlend.xcresult
          if-no-files-found: ignore