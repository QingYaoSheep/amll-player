name: Legacy mini player layout reproduction
on:
  push:
    branches: [codex/legacy-mini-player-repro]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: bash Scripts/generate-project.sh
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
      - name: Prepare iOS 18 simulator
        run: |
          xcrun simctl list runtimes --json > /tmp/legacy-runtimes.json
          if ! node -e 'const r=require("/tmp/legacy-runtimes.json").runtimes; if (!r.some(x=>x.isAvailable && x.version.startsWith("18."))) process.exit(1)'; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.0
          fi
          xcrun simctl list runtimes --json > /tmp/legacy-runtimes.json
          RUNTIME=$(node -e 'const r=require("/tmp/legacy-runtimes.json").runtimes.filter(x=>x.isAvailable && x.version.startsWith("18.")); if(!r.length)process.exit(1);console.log(r[r.length-1].identifier)')
          DEVICE_ID=$(xcrun simctl create 'AMLL legacy mini player' com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RUNTIME")
          echo "LEGACY_IPHONE_UDID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test legacy mini player above tabs
        run: >-
          xcodebuild test -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$LEGACY_IPHONE_UDID"
          -only-testing:AMLLPlayerUITests/LegacyMiniPlayerUITests
          -resultBundlePath build/Legacy-mini-player.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export evidence
        if: always()
        run: |
          if [[ -d build/Legacy-mini-player.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/Legacy-mini-player.xcresult > build/summary.json || true
            xcrun xcresulttool export attachments --path build/Legacy-mini-player.xcresult --output-path build/Images || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Legacy-mini-player-evidence
          path: |
            build/Legacy-mini-player.xcresult
            build/Images
            build/summary.json
      - name: Remove simulator
        if: always()
        run: |
          if [[ -n "$LEGACY_IPHONE_UDID" ]]; then
            xcrun simctl shutdown "$LEGACY_IPHONE_UDID" || true
            xcrun simctl delete "$LEGACY_IPHONE_UDID" || true
          fi
