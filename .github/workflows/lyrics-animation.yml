name: Lyrics animation regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lyrics-animation.yml'
      - 'AMLLPlayer/Rendering/LyricsAnimation*.swift'
      - 'AMLLPlayer/Rendering/LyricsBlossomAnimationOptions.swift'
      - 'AMLLPlayer/Rendering/LyricsBlossomLineSchedule.swift'
      - 'AMLLPlayer/Rendering/LyricsBlossomRun*.swift'
      - 'AMLLPlayer/Rendering/LyricsBlossomSelectionSchedule.swift'
      - 'AMLLPlayerTests/LyricsBlossomMechanismTests.swift'
      - 'AMLLPlayerTests/LyricsBlossomFamilyTwoTests.swift'
      - 'AMLLPlayer/Features/Lyrics/LyricsPagePresentation.swift'
      - 'AMLLPlayer/Features/Lyrics/AMLLLyricsPlayer.swift'
      - 'AMLLPlayer/Features/Lyrics/FullscreenLyricsPlayer.swift'
      - 'AMLLPlayer/Features/Lyrics/ImmersiveArtworkMedia.swift'
      - 'AMLLPlayer/Features/Lyrics/ImmersiveArtworkDebug.swift'
      - 'AMLLPlayer/Features/Settings/AppSettingsExport.swift'
      - 'AMLLPlayerTests/ImmersiveArtworkDebugStoreTests.swift'
      - 'AMLLPlayerTests/AppSettingsExportTests.swift'
      - 'AMLLPlayerTests/LyricsPagePresentationTests.swift'
      - 'AMLLPlayer/Rendering/LyricsAuxiliaryFade.swift'
      - 'AMLLPlayer/Rendering/LyricsAuxiliaryMotion.swift'
      - 'AMLLPlayer/Rendering/LyricsAuxiliaryBlur.swift'
      - 'AMLLPlayer/Rendering/AMLLNativeLyricsView.swift'
      - 'AMLLPlayer/Rendering/AMLLCoreTextLayout.swift'
      - 'AMLLPlayer/Rendering/AMLLPreparedRowImages.swift'
      - 'AMLLPlayer/Rendering/LyricTextLayout.swift'
      - 'AMLLPlayer/Rendering/LyricsRenderView.swift'
      - 'AMLLPlayer/Rendering/LyricsRenderConfiguration.swift'
      - 'AMLLPlayerTests/LyricsAuxiliaryFadeTests.swift'
      - 'AMLLPlayerTests/LyricsAuxiliaryMotionTests.swift'
      - 'AMLLPlayerTests/LyricsWrapAlignmentTests.swift'
      - 'AMLLPlayerTests/LyricsRomanizationEngineTests.swift'
      - 'AMLLPlayerTests/AMLLVisualActivityTests.swift'
      - 'AMLLPlayerTests/LyricsRenderViewTests.swift'
      - 'AMLLPlayerTests/Fixtures/auxiliary-video-motion.json'
      - 'AMLLPlayerTests/Fixtures/blossom-family2*'
      - 'AMLLPlayer/Rendering/LyricsBlossomScaleWait.swift'
      - 'AMLLPlayerTests/LyricsBlossomRunLayoutTests.swift'
      - 'AMLLPlayer/Rendering/AMLLScheduledSpring.swift'
      - 'AMLLPlayer/Rendering/AMLLFrameEngine.swift'
      - 'AMLLPlayer/Infrastructure/AppleMusic/AppleMusicPlayback.swift'
      - 'AMLLPlayerTests/AMLLSeekMotionTests.swift'
      - 'AMLLPlayerTests/LyricsBlossomLineEndTests.swift'
      - 'AMLLPlayerTests/Support/LyricsBlossomRunSweep.swift'
      - 'AMLLPlayer/Features/Lyrics/LyricsAnimationSettingsView.swift'
      - 'AMLLPlayerTests/LyricsAnimationStyleTests.swift'
      - 'AMLLPlayerTests/LyricsAnimationEvidenceTests.swift'
      - 'AMLLPlayerUITests/LyricsQuickSettingsUITests.swift'

permissions:
  contents: read

concurrency:
  group: lyrics-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27
        run: xcodebuild -version | head -1 | grep -E '^Xcode 27\.'
      - name: Prepare Metal compiler
        run: xcrun --sdk iphoneos metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Generate project
        run: bash Scripts/generate-project.sh
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project AMLLPlayer.xcodeproj -scheme AMLLPlayer
      - name: Prepare reference simulators
        run: |
          if ! xcrun simctl list runtimes --json | node -e 'const fs = require("node:fs"); const { selectRuntime } = require("./Scripts/prepare-ci-simulators.cjs"); selectRuntime(JSON.parse(fs.readFileSync(0, "utf8")).runtimes)'; then
            xcodebuild -downloadPlatform iOS
          fi
          node Scripts/prepare-ci-simulators.cjs
      - name: Test page presentation and auxiliary fades
        run: >-
          xcodebuild test
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerTests/DesktopLyricsTests
          -only-testing:AMLLPlayerTests/LyricsPagePresentationTests
          -only-testing:AMLLPlayerTests/ImmersiveArtworkDebugStoreTests
          -only-testing:AMLLPlayerTests/ImmersiveArtworkLayersTests
          -only-testing:AMLLPlayerTests/ImmersiveLyricsLayoutTests
          -only-testing:AMLLPlayerTests/AppSettingsExportTests
          -only-testing:AMLLPlayerTests/ArtworkMediaTests/testLegacyConfigurationKeepsSquareLayout
          -only-testing:AMLLPlayerTests/LyricsAuxiliaryFadeTests
          -only-testing:AMLLPlayerTests/LyricsAuxiliaryMotionTests
          -only-testing:AMLLPlayerTests/LyricsWrapAlignmentTests
          -only-testing:AMLLPlayerTests/ImmersiveArtworkMediaTests/testImmersiveLyricStatusBarMaskPreservesTheOriginalFeatherBelowIt
          -only-testing:AMLLPlayerTests/LyricsRomanizationEngineTests
          -only-testing:AMLLPlayerTests/LyricsBlossomMechanismTests/testLatePronunciationCatchUpContinuesAfterBodyLeavesSelection
          -only-testing:AMLLPlayerTests/AMLLVisualActivityTests/testRealCanvasStartsShrinkingAndFadingWithItsFirstUpwardFrame
          -only-testing:AMLLPlayerTests/LyricsRenderViewTests/testCompletedWordHasFullMaskAndBackwardSeekRestoresGradient
          -only-testing:AMLLPlayerTests/LyricsSeekPageTests/testRapidPresentationModesKeepDocumentClockAndTheSingleProductionCanvas
          -only-testing:AMLLPlayerTests/LyricsSeekPageTests/testPhoneMetadataTravelsWithTheCoverInsteadOfOnlyCrossfading
          -only-testing:AMLLPlayerTests/LyricsSeekPageTests/testRetainedHiddenCanvasResumesAtTheLatestConfirmedAudioTime
          -only-testing:AMLLPlayerTests/LyricsSeekPageTests/testOrdinaryMeshForegroundBlendingSurvivesReentryAndLayoutChanges
          -resultBundlePath build/Page-presentation-tests.xcresult
          -collect-test-diagnostics never
          CODE_SIGNING_ALLOWED=NO
      - name: Export presentation summary
        if: always()
        run: |
          if [[ -d build/Page-presentation-tests.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/Page-presentation-tests.xcresult > build/Page-presentation-summary.json
          fi
      - name: Upload presentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lyrics-page-presentation-evidence
          path: |
            build/Page-presentation-tests.xcresult
            build/Page-presentation-summary.json
          if-no-files-found: ignore
      - name: Test animation engine and real settings page
        run: >-
          xcodebuild test
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -destination "platform=iOS Simulator,id=$CI_IPHONE_UDID"
          -only-testing:AMLLPlayerTests/LyricsAnimationStyleTests
          -only-testing:AMLLPlayerTests/AMLLFramePerformanceTests
          -only-testing:AMLLPlayerTests/LyricsAnimationEvidenceTests
          -only-testing:AMLLPlayerTests/AMLLScheduledSpringTests
          -only-testing:AMLLPlayerTests/LyricsBlossomLineEndTests
          -only-testing:AMLLPlayerTests/LyricsBlossomRunLayoutTests
          -only-testing:AMLLPlayerTests/LyricsBlossomMechanismTests
          -only-testing:AMLLPlayerTests/LyricsBlossomFamilyTwoTests
          -only-testing:AMLLPlayerTests/ImmersiveArtworkMediaTests/testVideoFirstFrameReplacesStillFallbackWithoutRestartingPlayer
          -only-testing:AMLLPlayerTests/ImmersiveArtworkMediaTests/testRetiredPresentationCannotInvalidateCurrentPlayersReflection
          -only-testing:AMLLPlayerTests/AMLLSeekMotionTests
          -only-testing:AMLLPlayerTests/AMLLSeekCanvasTests
          -only-testing:AMLLPlayerTests/AppleMusicIntegrationTests/testApplePlaybackSnapshotUpdatesLyricsSeekRevisionAndIgnoresSpotifySnapshot
          -only-testing:AMLLPlayerUITests/LyricsQuickSettingsUITests/testFineAnimationStylesSaveIndependentOptionsAndKeepLyricsPage
          -only-testing:AMLLPlayerUITests/LyricsQuickSettingsUITests/testImmersiveLyricsModeStaysOpenPersistsAndFallsBackInLandscape
          -only-testing:AMLLPlayerUITests/AMLLPlayerUITests/testLyricsSearchPreviewApplyAndManualLock
          -resultBundlePath build/Animation-tests.xcresult
          -collect-test-diagnostics never
          CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          if [[ -d build/Animation-tests.xcresult ]]; then
            xcrun xcresulttool export attachments --path build/Animation-tests.xcresult --output-path build/Animation-images
          fi
      - name: Upload scoped test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lyrics-animation-regression-evidence
          path: |
            build/Animation-tests.xcresult
            build/Animation-images
          if-no-files-found: ignore
      - name: Remove reference simulators
        if: always()
        run: |
          for DEVICE_ID in "${CI_IPHONE_UDID:-}" "${CI_IPAD_UDID:-}"; do
            if [[ -n "$DEVICE_ID" ]]; then
              xcrun simctl shutdown "$DEVICE_ID" || true
              xcrun simctl delete "$DEVICE_ID"
            fi
          done
