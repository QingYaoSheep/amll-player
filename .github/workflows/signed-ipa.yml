name: Signed development IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode 27 SDK
        run: |
          xcodebuild -version
          [[ "$(xcrun --sdk iphoneos --show-sdk-version)" == 27.* ]]

      - name: Validate required secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          KEYCHAIN_PASSWORD: ${{ secrets.TEMPORARY_KEYCHAIN_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_LOCK_SCREEN_LYRICS_PROVISIONING_PROFILE_BASE64 }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$DEVELOPMENT_TEAM"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$PROFILE_BASE64"
          test -n "$WIDGET_PROFILE_BASE64"
          test -n "$SPOTIFY_CLIENT_ID"

      - name: Write build configuration
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          {
            echo "SPOTIFY_CLIENT_ID = $SPOTIFY_CLIENT_ID"
            echo "SPOTIFY_REDIRECT_URI = amllplayer://spotify-callback"
          } > Configuration/Secrets.xcconfig

      - name: Install signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.TEMPORARY_KEYCHAIN_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_LOCK_SCREEN_LYRICS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/development.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/lock-screen-lyrics.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/amll-signing.keychain-db"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          echo -n "$WIDGET_PROFILE_BASE64" | base64 --decode -o "$WIDGET_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() {
            local path="$1" name_key="$2" bundle_id="$3" uuid name identifier
            security cms -D -i "$path" > "$path.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$path.plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$path.plist")
            identifier=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$path.plist")
            [[ "$identifier" == *."$bundle_id" || "$identifier" == *.\* ]]
            cp "$path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "$name_key=$name" >> "$GITHUB_ENV"
          }
          install_profile "$PROFILE_PATH" APP_PROFILE_NAME net.stevexmh.amllplayer
          install_profile "$WIDGET_PROFILE_PATH" WIDGET_PROFILE_NAME net.stevexmh.amllplayer.lockscreenlyrics

      - name: Generate project
        run: bash Scripts/generate-project.sh

      - name: Archive signed application
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: >-
          xcodebuild archive
          -project AMLLPlayer.xcodeproj
          -scheme AMLLPlayer
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/AMLLPlayer.xcarchive"
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          CODE_SIGN_STYLE=Manual
          AMLL_APP_PROFILE="$APP_PROFILE_NAME"
          AMLL_LOCK_SCREEN_LYRICS_PROFILE="$WIDGET_PROFILE_NAME"

      - name: Verify archived application bundle and signatures
        run: |
          APP_BUNDLE="$RUNNER_TEMP/AMLLPlayer.xcarchive/Products/Applications/AMLLPlayer.app"
          bash Scripts/verify-ios-app-bundle.sh "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"

      - name: Export IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          cp Configuration/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $DEVELOPMENT_TEAM" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:net.stevexmh.amllplayer string $APP_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:net.stevexmh.amllplayer.lockscreenlyrics string $WIDGET_PROFILE_NAME" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AMLLPlayer.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AMLLPlayer-development-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
