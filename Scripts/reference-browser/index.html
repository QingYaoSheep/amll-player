<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMLL original core — development reference</title>
<link rel="stylesheet" href="style.css">
<style>
  html,body { margin:0; background:#111; color:white; font-family:-apple-system,BlinkMacSystemFont,sans-serif }
  #viewport { position:relative; width:402px; height:700px; overflow:hidden; background:#111 }
  #viewport > div { width:100%; height:100%; font-weight:600; font-size:35px }
  #tools { position:fixed; top:0; left:calc(402px + 24px); width:270px; padding:16px }
  button,input { margin:4px; min-height:32px }
  pre { white-space:pre-wrap; font-size:12px }
</style>
<div id="viewport"></div>
<aside id="tools">
  <p>原版 core 0.5.2 歌词区对照</p>
  <button id="step60">Seek + 1/60 s</button><button id="step120">Seek + 1/120 s</button>
  <button id="play">播放／暂停</button>
  <input id="time" type="number" value="1" min="0" step="0.1" aria-label="秒">
  <button id="seek">Seek</button><button id="export">导出布局及关键帧</button>
  <label><input id="record" type="checkbox">记录轨迹（最多 1200 帧）</label>
  <button id="clear">清空轨迹</button>
  <pre id="status">正在初始化原版…</pre>
  <p>此页是歌词区开发对照。Seek 按钮按视频帧时长跳转；CSS/WAAPI 仍使用浏览器时间，不是冻结后的动画单帧步进。完整页面、Apple 字体及虚拟时钟尚待验收。</p>
</aside>
<script type="module" src="reference.js"></script>
