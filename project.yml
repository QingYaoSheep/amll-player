name: AMLLPlayer

options:
  bundleIdPrefix: net.stevexmh
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    AMLL_BUILD_COMMIT: "local"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk.git
    exactVersion: 5.0.1

targets:
  AMLLPlayer:
    type: application
    platform: iOS
    sources:
      - path: AMLLPlayer
        excludes:
          - Resources
      - path: AMLLPlayer/Resources
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Licenses
        buildPhase: resources
      - path: SharedLockScreenLyrics
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer
        PRODUCT_NAME: AMLLPlayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Configuration/AMLLPlayer.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AMLL_APP_PROFILE)
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        MARKETING_VERSION: 1.0.0
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/AMLLPlayer-Info.plist
      properties:
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: 允许 AMLL 访问 Apple Music 资料库并同步系统音乐播放与歌词。
        CFBundleDisplayName: AMLL Player
        AMLLBuildCommit: $(AMLL_BUILD_COMMIT)
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Spotify
            CFBundleURLSchemes:
              - amllplayer
        LSApplicationCategoryType: public.app-category.music
        LSApplicationQueriesSchemes:
          - spotify
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        SpotifyRedirectURI: $(SPOTIFY_REDIRECT_URI)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
    dependencies:
      - target: LockScreenLyricsWidget
        embed: true
      - package: SpotifyiOS
        product: SpotifyiOS
      - sdk: AuthenticationServices.framework
      - sdk: Security.framework
      - sdk: MusicKit.framework
      - sdk: MediaPlayer.framework
    postBuildScripts:
      - name: Strip Debug Fixtures in Release
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION:-}" = "Release" ]; then
            rm -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/amll-shared-lyrics.json" \
                  "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/amll-shared-replay.json"
          fi

  LockScreenLyricsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: LockScreenLyricsWidget
        excludes:
          - Resources
      - path: LockScreenLyricsWidget/Resources
        buildPhase: resources
      - path: SharedLockScreenLyrics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer.lockscreenlyrics
        PRODUCT_NAME: LockScreenLyricsWidget
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        APPLICATION_EXTENSION_API_ONLY: YES
        PROVISIONING_PROFILE_SPECIFIER: $(AMLL_LOCK_SCREEN_LYRICS_PROFILE)
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/LockScreenLyricsWidget-Info.plist
      properties:
        CFBundleDisplayName: Lock Screen Lyrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AMLLPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AMLLPlayerTests
        excludes:
          - Fixtures
      - path: AMLLPlayerTests/Fixtures
        buildPhase: resources
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer.tests
        PRODUCT_NAME: AMLLPlayerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AMLLPlayer.app/AMLLPlayer
    dependencies:
      - target: AMLLPlayer

  AMLLPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AMLLPlayerUITests
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer.uitests
        PRODUCT_NAME: AMLLPlayerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AMLLPlayer
    dependencies:
      - target: AMLLPlayer

schemes:
  AMLLPlayer:
    build:
      targets:
        AMLLPlayer: all
        AMLLPlayerTests:
          - test
        AMLLPlayerUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AMLLPlayerTests
        - AMLLPlayerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
