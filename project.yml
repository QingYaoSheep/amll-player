name: AMLLPlayer

options:
  bundleIdPrefix: net.stevexmh
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk.git
    exactVersion: 5.0.1

targets:
  AMLLPlayer:
    type: application
    platform: iOS
    sources:
      - path: AMLLPlayer
        excludes:
          - Resources
      - path: AMLLPlayer/Resources
        buildPhase: resources
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer
        PRODUCT_NAME: AMLLPlayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Configuration/AMLLPlayer.entitlements
        CURRENT_PROJECT_VERSION: 1
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        MARKETING_VERSION: 0.1.0
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/AMLLPlayer-Info.plist
      properties:
        CFBundleDisplayName: AMLL Player
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: Spotify
            CFBundleURLSchemes:
              - amllplayer
        LSApplicationCategoryType: public.app-category.music
        LSApplicationQueriesSchemes:
          - spotify
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        SpotifyRedirectURI: $(SPOTIFY_REDIRECT_URI)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS

  AMLLPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AMLLPlayerTests
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer.tests
        PRODUCT_NAME: AMLLPlayerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AMLLPlayer.app/AMLLPlayer
    dependencies:
      - target: AMLLPlayer

  AMLLPlayerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AMLLPlayerUITests
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.stevexmh.amllplayer.uitests
        PRODUCT_NAME: AMLLPlayerUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AMLLPlayer
    dependencies:
      - target: AMLLPlayer

schemes:
  AMLLPlayer:
    build:
      targets:
        AMLLPlayer: all
        AMLLPlayerTests:
          - test
        AMLLPlayerUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AMLLPlayerTests
        - AMLLPlayerUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
